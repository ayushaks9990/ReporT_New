        <rect width="166" height="66" rx="14" fill="#0B1525" fill-opacity="0.94" stroke="#29466F"/>
        <text x="18" y="25" fill="#7186A5" font-size="10" font-weight="700" letter-spacing="1.5">ANALYTICS ENGINE</text>
