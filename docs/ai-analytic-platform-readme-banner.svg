    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientTransform="translate(670 542) rotate(90) scale(190 770)">
      <stop stop-color="#F6C945" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#F6C945" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
