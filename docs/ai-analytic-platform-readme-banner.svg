        <rect x="182" width="126" height="38" rx="11" fill="#0E1A2D" stroke="#263B5C"/>
        <text x="245" y="25" text-anchor="middle" fill="#BBD1F4" font-size="12" font-weight="700">MAP SIGNALS</text>
        <path d="M321 19H345" stroke="#39567E" stroke-width="2"/>
        <path d="M339 13L345 19L339 25" stroke="#39567E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="358" width="132" height="38" rx="11" fill="#182544" stroke="#4D8DFF"/>
