<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">AI Analytic Platform</title>
  <desc id="description">Futuristic AutoGen business intelligence command center banner</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1510" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050811"/>
      <stop offset="0.55" stop-color="#091426"/>
      <stop offset="1" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="brand" x1="112" y1="96" x2="835" y2="364" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="0.48" stop-color="#77A9FF"/>
      <stop offset="1" stop-color="#4D8DFF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="1045" y1="94" x2="1457" y2="461" gradientUnits="userSpaceOnUse">
      <stop stop-color="#77A9FF"/>
      <stop offset="0.52" stop-color="#29D3C2"/>
      <stop offset="1" stop-color="#F6C945"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0" cy="0" r="1" gradientTransform="translate(1260 274) rotate(90) scale(171)">
      <stop stop-color="#183A72" stop-opacity="0.82"/>
      <stop offset="0.55" stop-color="#0B1E3D" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#07101F" stop-opacity="0.18"/>
